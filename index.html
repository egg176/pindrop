<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#246bfd">
  <title>PinDrop — Design community</title>
  <link rel="icon" href="assets/favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="index.html"><img class="logo" src="assets/logo-128.png" width="36" height="36" alt=""><span>PinDrop</span></a>
    <nav class="nav" aria-label="Main navigation">
      <a class="nav-link active" href="index.html" aria-current="page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <a class="nav-link" href="explore.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Explore</span></a>
      <a class="nav-link" href="battles.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"/><path d="m5 14 4 4"/><path d="m7 17-3 3"/><path d="m3 19 2 2"/></svg><span>Battles</span></a>
      <a class="nav-link" href="tournaments.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v5a6 6 0 0 1-12 0z"/><path d="M6 6H3v1a4 4 0 0 0 4 4"/><path d="M18 6h3v1a4 4 0 0 1-4 4"/><path d="M12 15v4"/><path d="M8 21h8"/></svg><span>Tournaments</span></a>
      <a class="nav-link" href="profile.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span></a>
      <a class="nav-link" href="account.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg><span>Account</span></a>
    </nav>
    <div class="side-bottom">
      <a class="btn-dark" href="create.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>Post design</span></a>
      <a class="btn-accent" href="account.html" data-signed-out-only>Sign in</a>
    </div>
  </aside>
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 class="page-title">Home</h1>
      <div class="top-actions"><label class="search"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="Search designs, creators…" aria-label="Search"></label><a class="avatar account-btn" href="account.html" data-auth-avatar aria-label="Your account">Y</a></div>
    </header>
    <a class="strip" href="tournaments.html">
      <span class="strip-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v5a6 6 0 0 1-12 0z"/><path d="M6 6H3v1a4 4 0 0 0 4 4"/><path d="M18 6h3v1a4 4 0 0 1-4 4"/><path d="M12 15v4"/><path d="M8 21h8"/></svg></span>
      <span class="strip-text"><strong>Tournaments are coming soon</strong> · Minimalist Logo Showdown, Poster Championship and more</span>
      <span class="strip-go">View →</span>
    </a>
    <nav class="tabs" aria-label="Design categories">
      <button class="tab category active" type="button" data-category="All Designs">All designs</button>
      <button class="tab category" type="button" data-category="Posters">Posters</button>
      <button class="tab category" type="button" data-category="Logos">Logos</button>
      <button class="tab category" type="button" data-category="Branding">Branding</button>
      <button class="tab category" type="button" data-category="Typography">Typography</button>
      <button class="tab category" type="button" data-category="UI/UX">UI/UX</button>
    </nav>
    <div class="sortbar">
      <label for="sortSelect">Sort by</label>
      <select id="sortSelect" class="select"><option value="latest">Latest</option><option value="likes">Most liked</option></select>
      <div class="view-toggle" role="group" aria-label="Post size">
        <button type="button" class="view-btn active" data-view="list" aria-pressed="true" aria-label="Large posts" title="Large posts"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="8" rx="1.5"/><rect x="3" y="13" width="18" height="8" rx="1.5"/></svg></button>
        <button type="button" class="view-btn" data-view="grid" aria-pressed="false" aria-label="Grid" title="Grid"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
      </div>
    </div>
    <section class="feed list" id="feed">
      <div class="empty-state" id="emptyState">Loading designs…</div>
    </section>
    <footer class="mobile-footer">PinDrop · Create. Share. Compete.</footer>
  </main>
</div>
<a class="floating-create" href="create.html" aria-label="Create a design" title="Create a design">+</a>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script src="feed.js"></script>
</body>
</html>
